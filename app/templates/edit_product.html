{% extends "layout.html" %}

{% block title %}Edit Produk  SmartLamp Admin{% endblock %}

{% block content %}
<section class="min-h-screen bg-brandBlack py-20 px-4">
    <div class="max-w-2xl mx-auto">
        
        <div class="mb-8 flex items-center gap-4">
            <a href="{{ url_for('admin_dashboard') }}" class="w-10 h-10 rounded-full bg-white/10 grid place-items-center hover:bg-brandYellow hover:text-brandBlack transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>
            <h1 class="font-heading font-bold text-3xl text-white">Edit Produk</h1>
        </div>

        <div class="bg-white/5 border border-white/10 rounded-2xl p-8 backdrop-blur-md">
            
            <form action="{{ url_for('edit_product', product_id=product.id) }}" method="POST" enctype="multipart/form-data" class="space-y-6">
                
                <div>
                    <label class="block text-xs font-bold text-white/70 uppercase mb-2">Nama Produk</label>
                    <input type="text" name="name" value="{{ product.name }}" required class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white focus:border-brandYellow focus:outline-none transition">
                </div>

                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-white/70 uppercase mb-2">Harga (Rp)</label>
                        <input type="number" name="price" value="{{ product.price }}" required class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white focus:border-brandYellow focus:outline-none transition">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-white/70 uppercase mb-2">Kategori</label>
                        <select name="category" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white focus:border-brandYellow focus:outline-none transition">
                            <option value="Bohlam Pintar" {% if product.category == 'Bohlam Pintar' %}selected{% endif %}>Bohlam Pintar</option>
                            <option value="Lampu Hias" {% if product.category == 'Lampu Hias' %}selected{% endif %}>Lampu Hias</option>
                            <option value="Paket Hemat" {% if product.category == 'Paket Hemat' %}selected{% endif %}>Paket Hemat</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-white/70 uppercase mb-2">Foto Produk</label>
                    <div class="flex items-center gap-4 mb-3">
                        <img src="{{ url_for('static', filename='images/' + product.image) }}" class="w-16 h-16 rounded-lg object-cover border border-white/20">
                        <span class="text-xs text-white/40">Foto saat ini</span>
                    </div>
                    <input type="file" name="image" accept="image/*" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white/70 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-brandYellow file:text-brandBlack hover:file:bg-yellow-500 cursor-pointer">
                    <p class="text-[10px] text-white/40 mt-2">*Biarkan kosong jika tidak ingin mengganti foto.</p>
                </div>

                <div>
                    <label class="block text-xs font-bold text-white/70 uppercase mb-2">Deskripsi Lengkap</label>
                    <textarea name="description" rows="4" required class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white focus:border-brandYellow focus:outline-none transition">{{ product.description }}</textarea>
                </div>

                <div>
                    <label class="block text-xs font-bold text-white/70 uppercase mb-2">Spesifikasi</label>
                    <input type="text" name="specs" value="{{ product.specs }}" class="w-full bg-black/40 border border-white/10 rounded-xl p-3 text-white focus:border-brandYellow focus:outline-none transition">
                </div>

                <button type="submit" class="w-full py-4 rounded-xl bg-brandYellow text-brandBlack font-bold font-heading text-lg hover:shadow-[0_0_20px_rgba(255,193,7,0.4)] transition mt-4">
                    Update Produk
                </button>

            </form>
        </div>
    </div>
</section>
{% endblock %}
